<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#263f35">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ctext y='38' font-size='38'%3E🐾%3C/text%3E%3C/svg%3E">
  <meta name="description" content="고양이 탐정이 되어 율의 작은 발자국을 따라가세요. 고양이의 마음을 배우는 따뜻한 3D 추리 게임.">
  <title>오늘도, 너에게 · FindCat</title>
  <base data-trunk-public-url>
  <link data-trunk rel="rust" data-bin="findcat" data-cargo-features="web" data-wasm-opt="0">
  <link data-trunk rel="copy-dir" href="assets">
  <link data-trunk rel="copy-file" href="LICENSE">
  <link data-trunk rel="copy-file" href="THIRD_PARTY.md">
  <style>
    * { box-sizing: border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#263f35; }
    body { display:grid; place-items:center; font-family:system-ui,sans-serif; color:#fbf7ed; }
    #frame { position:fixed; inset:0; overflow:hidden; }
    #surface { width:100%; height:100%; }
    /* Winit may write inline pixel sizes when DPI changes. Keep CSS size separate
       from the physical backing buffer, including browser zoom and monitor moves. */
    canvas { display:block; width:100% !important; height:100% !important; outline:none; touch-action:none; }
    #boot { position:fixed; inset:0; display:grid; place-content:center; text-align:center; background:#263f35; padding:30px; z-index:2; }
    #boot h1 { font-size:clamp(30px,5vw,48px); margin:12px 0; }
    #boot p { line-height:1.8; color:#e2e9da; max-width:480px; margin:8px auto; }
    #boot small { color:#c2d1bd; }
    #fullscreen-toggle { position:fixed; right:8px; bottom:8px; z-index:3; width:36px; height:36px; padding:8px; border:1px solid #c2d1bd; border-radius:9px; background:#263f35e6; color:#fbf7ed; touch-action:manipulation; }
    #fullscreen-toggle[hidden] { display:none; }
    #fullscreen-toggle svg { display:block; width:100%; height:100%; }
    .paw { font-size:44px; animation:breathe 1.4s ease-in-out infinite alternate; }
    @keyframes breathe { to { transform:translateY(-7px); opacity:.6; } }
  </style>
  <script>
    if (new URLSearchParams(location.search).has('testbed')) document.documentElement.setAttribute('data-testbed','');
    // Browsers suspend sound until a gesture. Resume the game's own contexts on input.
    const contexts = [];
    if (window.AudioContext) {
      const NativeAudioContext = window.AudioContext;
      window.AudioContext = class extends NativeAudioContext {
        constructor(...args) { super(...args); contexts.push(this); }
      };
      for (const event of ['pointerdown','keydown']) addEventListener(event, () => {
        for (const ctx of contexts) if (ctx.state === 'suspended') ctx.resume();
      }, {capture:true});
    }
    addEventListener('error', e => {
      const status = document.getElementById('status');
      if (status && document.getElementById('boot').style.display !== 'none')
        status.textContent = '게임을 시작하지 못했어요. 브라우저를 업데이트하고 새로고침해 주세요.';
    });
    addEventListener('TrunkApplicationStarted', () => {
      document.getElementById('status').textContent = '동네와 고양이를 불러오고 있어요…';
    });
  </script>
</head>
<body>
  <main id="frame" aria-label="오늘도, 너에게 게임"><div id="surface"><canvas id="game" tabindex="0" aria-label="게임 화면. Enter로 시작, 장소 번호를 클릭해 조사하세요."></canvas></div></main>
  <div id="boot" role="status"><div class="paw">🐾</div><h1>오늘도, 너에게</h1><p id="status">작은 발자국을 따라갈 준비 중이에요…<br>처음에는 게임을 내려받는 데 잠시 걸릴 수 있어요.</p><p><small>PC 브라우저 권장 · Enter로 시작 · 장소 번호를 클릭해 조사</small></p></div>
  <button id="fullscreen-toggle" type="button" hidden aria-label="전체화면 켜기" aria-pressed="false" title="전체화면 켜기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
  <script>
    (() => {
      // Screen size alone would also match small desktop windows. Include touch iPads
      // that identify as Macs, without opting desktop browsers into automatic fullscreen.
      const mobile = navigator.userAgentData?.mobile === true
        || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (!mobile) return;

      const root = document.documentElement;
      const button = document.getElementById('fullscreen-toggle');
      const request = root.requestFullscreen || root.webkitRequestFullscreen;
      const enabled = root.requestFullscreen ? document.fullscreenEnabled : document.webkitFullscreenEnabled;
      if (!request || enabled === false) return;

      let attempted = false;
      let pending = false;
      const fullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
      const update = () => {
        const active = fullscreen();
        const label = active ? '전체화면 끄기' : '전체화면 켜기';
        button.setAttribute('aria-pressed', String(active));
        button.setAttribute('aria-label', label);
        button.title = label;
      };
      const enter = () => {
        if (pending || fullscreen()) return;
        pending = true;
        try {
          // Request synchronously inside a real gesture; rejected requests never block play.
          Promise.resolve(request.call(root, {navigationUI: 'hide'}))
            .catch(() => {})
            .finally(() => { pending = false; update(); });
        } catch {
          pending = false;
        }
      };

      button.hidden = false;
      document.addEventListener('fullscreenchange', update);
      document.addEventListener('webkitfullscreenchange', update);
      const gesture = window.PointerEvent ? 'pointerup' : 'touchend';
      document.addEventListener(gesture, event => {
        if (attempted || !event.isTrusted || event.target.closest?.('#fullscreen-toggle')) return;
        attempted = true;
        // Attempt once, so leaving fullscreen does not make the next game tap re-enter it.
        enter();
      }, {capture: true, passive: true});
      button.addEventListener('click', event => {
        event.stopPropagation();
        attempted = true;
        if (fullscreen()) {
          const exit = document.exitFullscreen || document.webkitExitFullscreen;
          try { Promise.resolve(exit?.call(document)).catch(() => {}); } catch {}
        } else {
          enter();
        }
      });
      update();
    })();
  </script>
  <noscript>게임을 실행하려면 JavaScript를 허용해 주세요.</noscript>
</body>
</html>
