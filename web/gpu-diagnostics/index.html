<main>
  <h1>FindCat 셰이더 진단</h1>
  <p>게임에서 사용하는 셰이더를 이 기기의 GPU에서 연결해 봅니다. 게임 실행 파일을 내려받거나 게임 설정·진행 상황을 바꾸지 않습니다.</p>
  <p id="status" role="status">검사 준비 중…</p>
  <pre id="results" aria-live="polite"></pre>
  <button id="copy" disabled>결과 복사</button><button id="download" disabled>상세 결과 저장</button>
  <p id="notice"></p>
  <details><summary>검사 항목 설명</summary><p>원본은 현재 게임의 GLSL입니다. 나머지 항목은 깊이 출력, 정점 출력, uniform 등을 하나씩 바꾼 비교 검사입니다. 비교 검사는 게임에 적용되지 않습니다. 모든 검사가 통과해도 게임의 전체 실행 성공을 보장하지는 않습니다.</p></details>
  <p><a href="../">게임으로 돌아가기</a> · <a href="../THIRD_PARTY.md">셰이더 라이선스</a></p>
