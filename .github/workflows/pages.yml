name: Build and deploy game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      NO_COLOR: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust and WebAssembly target
        run: |
          rustup toolchain install
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bevy-0.20-wasm-release
      - name: Test game rules
        run: cargo test --locked --lib --no-default-features
      - name: Install Trunk
        run: |
          curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.cargo/bin"
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build WebGL2 game
        run: trunk build --release --locked --public-url "${{ steps.pages.outputs.base_path }}/"
      - name: Include dependency notices
        run: python3 python/web_licenses.py
      - name: Preserve bootstraps for cached Pages documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/previous-pages
          for run in $(gh run list --workflow pages.yml --status success --limit 2 --json databaseId --jq '.[].databaseId'); do
            # Expired artifacts are older than the 10-minute Pages HTML cache.
            if ! gh run download "$run" --name github-pages --dir "artifacts/previous-pages/$run"; then
              echo "::warning::Previous Pages artifact $run is unavailable; skipping it."
            fi
          done
          python3 python/retain_web_releases.py artifacts/previous-pages
      - name: Verify desktop, tablet and cached-document startup
        run: |
          python3 -m pip install playwright==1.64.0 pillow==13.0.0
          python3 -m playwright install --with-deps chromium
          python3 python/validate_web_startup.py --chromium-only --software-renderer --cached-archives artifacts/previous-pages
      - name: Upload game
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4
