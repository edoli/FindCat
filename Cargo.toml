[package]
name = "findcat"
version = "1.0.0"
edition = "2024"
rust-version = "1.99.1"
description = "A small, warm detective adventure about understanding your cat."
license = "MIT"

[features]
default = ["desktop"]
desktop = ["dep:bevy"]
web = ["desktop", "bevy/webgl2"]

[[bin]]
name = "findcat"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
bevy = { version = "=0.20.0", optional = true, default-features = false, features = ["std", "async_executor", "multi_threaded", "bevy_asset", "bevy_audio", "bevy_color", "bevy_core_pipeline", "bevy_gltf", "bevy_log", "bevy_pbr", "bevy_render", "bevy_scene", "bevy_world_serialization", "bevy_image", "bevy_mesh", "bevy_camera", "bevy_light", "bevy_shader", "bevy_text", "bevy_ui", "bevy_ui_render", "bevy_ui_widgets", "ui_picking", "bevy_window", "bevy_winit", "keyboard", "mouse", "touch", "default_font", "png", "wav", "tonemapping_luts", "zstd_rust"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.106", features = ["Window", "Storage", "Document", "Element", "HtmlElement"] }
wasm-bindgen = "=0.2.129"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = "debuginfo"
